[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmpeg-micro"
version = "0.1.1"
description = "Official Python client for the FFmpeg Micro API: video transcoding, transcription and FFmpeg in the cloud."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FFmpeg Micro" }]
requires-python = ">=3.8"
keywords = ["ffmpeg", "video", "transcoding", "api", "ffmpeg-api", "video-processing", "transcription", "cloud"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "urllib3>=1.25.3,<3.0.0",
  "python-dateutil>=2.8.2",
  "pydantic>=2",
  "typing-extensions>=4.7.1",
]

[project.urls]
"FFmpeg Micro: The FFmpeg API" = "https://www.ffmpeg-micro.com"
Documentation = "https://www.ffmpeg-micro.com/docs"
"API spec" = "https://api.ffmpeg-micro.com/openapi.yaml"
Source = "https://github.com/ffmpeg-micro/ffmpeg-micro-python"

[tool.setuptools.packages.find]
include = ["ffmpeg_micro*"]

[tool.setuptools.package-data]
ffmpeg_micro = ["py.typed"]
